# -----------------------------------------------------------------------------
# RQ1.4 experimental / smoke test profile
#
# Intended for: Fast operational validation of the Kubernetes chain pipeline.
#
# Properties:
#   - 2 rounds, 10 measured iterations per condition (100 total iterations)
#   - All 5 conditions (monolithic + 4 chain variants)
#   - Parity validation and warmup included
#   - Relaxed warmup calibration thresholds
#   - Threading at default multi-core (4 threads), no stabilisation controls
#   - Validates: deployment, readiness, parity, metric schema, pipeline health
#
# NOT suitable for thesis-facing numbers.
#
# Usage:
#   kubectl exec -it -n rq14 benchmark-client -- \
#     python run_k8s_experiment.py --config configs/rq1/1.4/rq1_4_experimental.yaml
#
# Manifest generation:
#   python k8s/generate_manifests.py --config configs/rq1/1.4/rq1_4_experimental.yaml --all
# -----------------------------------------------------------------------------
experiment:
  name: "RQ1.4 experimental"
  description: "Kubernetes chain pipeline smoke test — operational validation only"

model:
  name: "resnet18"
  pretrained: true
  device: "cpu"
  input_shape: [1, 3, 224, 224]
  precision: "fp32"

conditions:
  - name: "monolithic_k8s_1svc"
    type: "chain"
    chain_split_points: []

  - name: "chain_2svc"
    type: "chain"
    chain_split_points: ["layer2"]

  - name: "chain_3svc"
    type: "chain"
    chain_split_points: ["layer1", "layer3"]

  - name: "chain_4svc"
    type: "chain"
    chain_split_points: ["layer1", "layer2", "layer3"]

  - name: "chain_5svc"
    type: "chain"
    chain_split_points: ["layer1", "layer2", "layer3", "layer4"]

benchmark:
  rounds: 2
  # Warmup count, parity, and warmup_calibration are kept uniform with the
  # thesis-facing configs. Smoke speed-up comes from rounds=2 and few measured
  # iterations.
  warmup_iterations: 50
  measured_iterations: 10
  cooldown_seconds: 2
  seed: 42

# RQ1.4 is a chain experiment: gRPC and carry-forward fields are not used
# (K8s wiring uses kubernetes.grpc_port / kubernetes.max_message_bytes;
# selection is fixed by the predefined chain family). Both blocks are omitted.

parity:
  atol: 1.0e-5
  num_inputs: 5

warmup_calibration:
  window: 10
  cv_threshold: 0.02
  max_extra_iterations: 0

cpu_stabilisation:
  threading:
    pytorch_intra_op: 4
    pytorch_inter_op: 1
    omp_num_threads: 4
    mkl_num_threads: 4
    openblas_num_threads: 4
  affinity:
    enabled: false
    num_cores: 4
    avoid_smt: true
    explicit_cpus: null
  priority:
    enabled: false
    nice_value: 0
  governor:
    set_governor: false
    requested_mode: "performance"
  turbo:
    disable_turbo: false

kubernetes:
  namespace: "rq14"
  service_name_template: "{condition}-svc-{index}"
  grpc_port: 50051
  max_message_bytes: 16777216
  readiness_timeout: 120.0
  image: "thesis-inference:latest"
  image_pull_policy: "IfNotPresent"
  resources:
    cpu_request: "2"
    cpu_limit: "2"
    memory_request: "512Mi"
    memory_limit: "512Mi"
