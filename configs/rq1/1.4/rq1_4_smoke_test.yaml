# -----------------------------------------------------------------------------
# RQ1.4 Smoke Test Configuration
#
# Chain decomposition of ResNet-18 into 1–5 synchronous microservices.
# Minimal iterations for pipeline validation only.
# Not suitable for thesis-facing numbers.
# -----------------------------------------------------------------------------
experiment:
  name: "RQ1.4 smoke test"
  description: "Chain decomposition smoke test with minimal iterations"

model:
  name: "resnet18"
  pretrained: true
  device: "cpu"
  input_shape: [1, 3, 224, 224]
  precision: "fp32"

conditions:
  - name: "monolithic_k8s_1svc"
    type: "chain"
    chain_split_points: []

  - name: "chain_2svc"
    type: "chain"
    chain_split_points: ["layer2"]

  - name: "chain_3svc"
    type: "chain"
    chain_split_points: ["layer1", "layer3"]

  - name: "chain_4svc"
    type: "chain"
    chain_split_points: ["layer1", "layer2", "layer3"]

  - name: "chain_5svc"
    type: "chain"
    chain_split_points: ["layer1", "layer2", "layer3", "layer4"]

benchmark:
  rounds: 5
  warmup_iterations: 50
  measured_iterations: 100
  cooldown_seconds: 5
  seed: 42

# RQ1.4 is a chain experiment: gRPC and carry-forward fields are not used
# (K8s wiring uses kubernetes.grpc_port / kubernetes.max_message_bytes;
# selection is fixed by the predefined chain family). Both blocks are omitted.

parity:
  atol: 1.0e-5
  num_inputs: 5

warmup_calibration:
  window: 10
  cv_threshold: 0.02
  max_extra_iterations: -1

cpu_stabilisation:
  threading:
    pytorch_intra_op: 4
    pytorch_inter_op: 1
    omp_num_threads: 4
    mkl_num_threads: 4
    openblas_num_threads: 4
  affinity:
    enabled: true
    num_cores: 4
    avoid_smt: true
    explicit_cpus: null
  priority:
    enabled: false
    nice_value: 0
  governor:
    set_governor: false
    requested_mode: "performance"
  turbo:
    disable_turbo: false

kubernetes:
  namespace: "rq14"
  service_name_template: "{condition}-svc-{index}"
  grpc_port: 50051
  max_message_bytes: 16777216
  readiness_timeout: 120.0
  image: "thesis-inference:latest"
  image_pull_policy: "IfNotPresent"
  resources:
    cpu_request: "4"
    cpu_limit: "4"
    memory_request: "1Gi"
    memory_limit: "1Gi"
