# -----------------------------------------------------------------------------
# RQ1.4b kind Multi-Node Sensitivity Profile
#
# Purpose: Local sensitivity analogue of RQ1.5b. Runs the same chain family on
#   a 6-worker kind cluster with pod anti-affinity so every chain hop crosses
#   a node boundary. Cheap (no Azure cost) and fast.
#
# Use kind cluster definition: k8s/kind/kind-multi-node.yaml
#   kind create cluster --name thesis-rq14b --config k8s/kind/kind-multi-node.yaml
#   kind load docker-image thesis-inference:latest --name thesis-rq14b
#
# Thesis status: SECONDARY (sensitivity stage, not the frozen primary).
# -----------------------------------------------------------------------------
experiment:
  name: "RQ1.4b kind multi-node sensitivity"
  description: "kind multi-node sensitivity: every chain hop crosses a node boundary"

model:
  name: "resnet18"
  pretrained: true
  device: "cpu"
  input_shape: [1, 3, 224, 224]
  precision: "fp32"

conditions:
  - name: "monolithic_k8s_1svc"
    type: "chain"
    chain_split_points: []

  - name: "chain_2svc"
    type: "chain"
    chain_split_points: ["layer2"]

  - name: "chain_3svc"
    type: "chain"
    chain_split_points: ["layer1", "layer3"]

  - name: "chain_4svc"
    type: "chain"
    chain_split_points: ["layer1", "layer2", "layer3"]

  - name: "chain_5svc"
    type: "chain"
    chain_split_points: ["layer1", "layer2", "layer3", "layer4"]

benchmark:
  rounds: 5
  warmup_iterations: 50
  measured_iterations: 200
  cooldown_seconds: 5
  seed: 42

parity:
  atol: 1.0e-5
  num_inputs: 5

warmup_calibration:
  window: 10
  cv_threshold: 0.02
  max_extra_iterations: -1

cpu_stabilisation:
  threading:
    pytorch_intra_op: 1
    pytorch_inter_op: 1
    omp_num_threads: 1
    mkl_num_threads: 1
    openblas_num_threads: 1
  affinity:
    enabled: true
    num_cores: 1
    avoid_smt: true
    explicit_cpus: null
  priority:
    enabled: true
    nice_value: -5
  governor:
    set_governor: true
    requested_mode: "performance"
  turbo:
    disable_turbo: true

kubernetes:
  namespace: "rq14b"
  service_name_template: "{condition}-svc-{index}"
  grpc_port: 50051
  max_message_bytes: 16777216
  readiness_timeout: 180.0
  image: "thesis-inference:latest"
  image_pull_policy: "IfNotPresent"
  resources:
    cpu_request: "1"
    cpu_limit: "1"
    memory_request: "512Mi"
    memory_limit: "512Mi"
  client_resources:
    cpu_request: "1"
    cpu_limit: "1"
    memory_request: "1Gi"
    memory_limit: "1Gi"
  placement:
    strategy: "multi_node_anti_affinity"
    require_distinct_nodes: true
    require_dedicated_client_node: true
    min_nodes: 6
