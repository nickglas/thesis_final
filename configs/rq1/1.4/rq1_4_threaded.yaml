# -----------------------------------------------------------------------------
# RQ1.4 threaded benchmark profile
#
# Intended for: Realistic multi-threaded Kubernetes benchmark.
#
# Properties:
#   - 5 rounds × 200 measured iterations × 5 conditions = 5,000 iterations
#   - Multi-threaded CPU execution (4 intra-op threads)
#   - Strict warmup calibration (window=10, cv=0.02)
#   - CPU affinity requested (4 physical cores, SMT avoided)
#   - Process priority requested (nice=-5)
#   - Governor and turbo controls disabled (not accessible from containers)
#
# Thesis status: SECONDARY.
#   Thesis-usable if fully controlled mode proves operationally impractical
#   or if multi-threaded comparison is explicitly needed. Otherwise serves
#   as a complementary measurement alongside the fully controlled profile.
#
# Kubernetes resource expectations:
#   - Service pods: resource requests/limits should be set to cpu=4, memory≥1Gi
#     in manifests for Guaranteed QoS class.
#   - Client pod: same resource settings.
#   - Static CPU manager policy recommended but not required.
#
# Usage:
#   kubectl exec -it -n rq14 benchmark-client -- \
#     python run_k8s_experiment.py --config configs/rq1/1.4/rq1_4_threaded.yaml --run-analysis
#
# Manifest generation:
#   python k8s/generate_manifests.py --config configs/rq1/1.4/rq1_4_threaded.yaml --all
# -----------------------------------------------------------------------------
experiment:
  name: "RQ1.4 threaded"
  description: "Multi-threaded Kubernetes chain benchmark (4 cores, pinned)"

model:
  name: "resnet18"
  pretrained: true
  device: "cpu"
  input_shape: [1, 3, 224, 224]
  precision: "fp32"

conditions:
  - name: "monolithic_k8s_1svc"
    type: "chain"
    chain_split_points: []

  - name: "chain_2svc"
    type: "chain"
    chain_split_points: ["layer2"]

  - name: "chain_3svc"
    type: "chain"
    chain_split_points: ["layer1", "layer3"]

  - name: "chain_4svc"
    type: "chain"
    chain_split_points: ["layer1", "layer2", "layer3"]

  - name: "chain_5svc"
    type: "chain"
    chain_split_points: ["layer1", "layer2", "layer3", "layer4"]

benchmark:
  rounds: 5
  warmup_iterations: 50
  measured_iterations: 200
  cooldown_seconds: 5
  seed: 42

# RQ1.4 is a chain experiment: gRPC and carry-forward fields are not used
# (K8s wiring uses kubernetes.grpc_port / kubernetes.max_message_bytes;
# selection is fixed by the predefined chain family). Both blocks are omitted.

parity:
  atol: 1.0e-5
  num_inputs: 5

warmup_calibration:
  window: 10
  cv_threshold: 0.02
  max_extra_iterations: 0

cpu_stabilisation:
  threading:
    pytorch_intra_op: 4
    pytorch_inter_op: 1
    omp_num_threads: 4
    mkl_num_threads: 4
    openblas_num_threads: 4
  affinity:
    enabled: true
    num_cores: 4
    avoid_smt: true
    explicit_cpus: null
  priority:
    enabled: true
    nice_value: -5
  governor:
    set_governor: false
    requested_mode: "performance"
  turbo:
    disable_turbo: false

kubernetes:
  namespace: "rq14"
  service_name_template: "{condition}-svc-{index}"
  grpc_port: 50051
  max_message_bytes: 16777216
  readiness_timeout: 120.0
  image: "thesis-inference:latest"
  image_pull_policy: "IfNotPresent"
  resources:
    cpu_request: "4"
    cpu_limit: "4"
    memory_request: "1Gi"
    memory_limit: "1Gi"
