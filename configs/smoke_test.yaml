experiment:
  name: "RQ1.1-smoke"
  description: "Smoke test with minimal iterations"

model:
  name: "resnet18"
  pretrained: true
  device: "cpu"
  input_shape: [1, 3, 224, 224]
  precision: "fp32"

conditions:
  - name: "monolithic"
    type: "monolithic"
  - name: "split_after_layer2"
    type: "split"
    split_after: "layer2"

benchmark:
  rounds: 1
  warmup_iterations: 3
  measured_iterations: 5
  cooldown_seconds: 1
  seed: 42

grpc:
  host: "127.0.0.1"
  port: 50055
  max_message_bytes: 16777216

carry_forward:
  near_best_window_pct: 10.0
  degeneracy_threshold_pct: 5.0
