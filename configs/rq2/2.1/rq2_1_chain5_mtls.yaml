# -----------------------------------------------------------------------------
# RQ2.1 Optional Stress Validation Managed-Istio mTLS Configuration
#
# Purpose: optional secure AKS chain_5svc stress case for RQ2.1. This is not the
# primary RQ2.1 experiment. It evaluates whether the same managed AKS Istio mTLS
# + service-identity mechanism remains practical across the maximum chain depth
# used in RQ1.4/RQ1.5.
# -----------------------------------------------------------------------------
experiment:
  name: "RQ2.1 optional chain_5svc mTLS stress"
  description: "RQ2.1 optional managed AKS Istio mTLS stress deployment for chain_5svc"

model:
  name: "resnet18"
  pretrained: true
  device: "cpu"
  input_shape: [1, 3, 224, 224]
  precision: "fp32"

conditions:
  - name: "chain_5svc_mtls"
    type: "chain"
    chain_split_points: ["layer1", "layer2", "layer3", "layer4"]

benchmark:
  rounds: 1
  warmup_iterations: 50
  measured_iterations: 200
  cooldown_seconds: 5
  seed: 42

grpc:
  host: "127.0.0.1"
  port: 50051
  max_message_bytes: 16777216

carry_forward:
  near_best_window_pct: 5.0
  degeneracy_threshold_pct: 10.0

parity:
  atol: 1.0e-5
  num_inputs: 5

warmup_calibration:
  window: 10
  cv_threshold: 0.02
  max_extra_iterations: -1

cpu_stabilisation:
  threading:
    pytorch_intra_op: 1
    pytorch_inter_op: 1
    omp_num_threads: 1
    mkl_num_threads: 1
    openblas_num_threads: 1
  affinity:
    enabled: true
    num_cores: 1
    avoid_smt: true
    explicit_cpus: null
  priority:
    enabled: true
    nice_value: -5
  governor:
    set_governor: false
    requested_mode: "performance"
  turbo:
    disable_turbo: false

kubernetes:
  namespace: "rq21-chain5-mtls"
  client_namespace: "rq21-client-chain5-mtls"
  client_pod_name: "benchmark-client"
  security_condition: "mtls"
  service_name_template: "{condition}-svc-{index}"
  grpc_port: 50051
  max_message_bytes: 16777216
  readiness_timeout: 120.0
  image: "thesisrq21acr26.azurecr.io/thesis-inference@sha256:9d65f25d9a6ee98e29fe4126271d54a39a7816669fa2edaab1367901886f8f25"
  image_pull_policy: "Always"
  resources:
    cpu_request: "1"
    cpu_limit: "1"
    memory_request: "1Gi"
    memory_limit: "1Gi"
  client_resources:
    # Chain5 must fit under the 10-vCPU regional quota on a single D8 node.
    # Keep the limit at 1 CPU so the client can burst during benchmark work,
    # but lower the request so the non-meshed client and debug probe can schedule.
    cpu_request: "100m"
    cpu_limit: "1"
    memory_request: "1Gi"
    memory_limit: "1Gi"
  placement:
    strategy: "strict_same_node"
    require_same_node: true
    fail_if_not_colocated: true
    node_selector: {}
    node_pool: "rq15pool"
  resource_sampling:
    enabled: true
    interval_seconds: 5
    source: "kubectl_top"
    require_metrics_server: false
  metadata:
    capture_mesh: true
    record_control_plane_placement: true
  mesh:
    enabled: true
    implementation: "managed AKS Istio add-on"
    namespace: "rq21-chain5-mtls"
    revision: "asm-1-29"
    service_accounts:
      "1": "rq21-chain5-svc1"
      "2": "rq21-chain5-svc2"
      "3": "rq21-chain5-svc3"
      "4": "rq21-chain5-svc4"
      "5": "rq21-chain5-svc5"
    proxy_resources:
      cpu_request: "100m"
      cpu_limit: "500m"
      memory_request: "128Mi"
      memory_limit: "512Mi"
    peer_authentication:
      enabled: true
      namespace_mode: "PERMISSIVE"
      strict_workloads:
        - name: "service2-strict"
          segment_index: "2"
          mode: "STRICT"
        - name: "service3-strict"
          segment_index: "3"
          mode: "STRICT"
        - name: "service4-strict"
          segment_index: "4"
          mode: "STRICT"
        - name: "service5-strict"
          segment_index: "5"
          mode: "STRICT"
    authorization_policy:
      enabled: true
      policies:
        - name: "service2-service1-only"
          source_segment_index: "1"
          downstream_segment_index: "2"
        - name: "service3-service2-only"
          source_segment_index: "2"
          downstream_segment_index: "3"
        - name: "service4-service3-only"
          source_segment_index: "3"
          downstream_segment_index: "4"
        - name: "service5-service4-only"
          source_segment_index: "4"
          downstream_segment_index: "5"
