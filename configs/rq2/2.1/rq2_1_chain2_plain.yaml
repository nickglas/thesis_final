# -----------------------------------------------------------------------------
# RQ2.1 Thesis-Facing Plain Baseline Configuration
#
# Purpose: primary non-mesh AKS baseline for the paired chain_2svc RQ2.1 run.
# This config defines one interleaved round. Run the paired runner with
# `--paired-passes 5` to obtain the thesis-facing 5-round matched result set.
# -----------------------------------------------------------------------------
experiment:
  name: "RQ2.1 chain_2svc plain"
  description: "RQ2.1 non-mesh AKS baseline for the primary chain_2svc topology"

model:
  name: "resnet18"
  pretrained: true
  device: "cpu"
  input_shape: [1, 3, 224, 224]
  precision: "fp32"

conditions:
  - name: "chain_2svc_plain"
    type: "chain"
    chain_split_points: ["layer2"]

benchmark:
  rounds: 1
  warmup_iterations: 50
  measured_iterations: 200
  cooldown_seconds: 5
  seed: 42

grpc:
  host: "127.0.0.1"
  port: 50051
  max_message_bytes: 16777216

carry_forward:
  near_best_window_pct: 5.0
  degeneracy_threshold_pct: 10.0

parity:
  atol: 1.0e-5
  num_inputs: 5

warmup_calibration:
  window: 10
  cv_threshold: 0.02
  max_extra_iterations: -1

cpu_stabilisation:
  threading:
    pytorch_intra_op: 1
    pytorch_inter_op: 1
    omp_num_threads: 1
    mkl_num_threads: 1
    openblas_num_threads: 1
  affinity:
    enabled: true
    num_cores: 1
    avoid_smt: true
    explicit_cpus: null
  priority:
    enabled: true
    nice_value: -5
  governor:
    set_governor: false
    requested_mode: "performance"
  turbo:
    disable_turbo: false

kubernetes:
  namespace: "rq21-chain2-plain"
  client_namespace: "rq21-client-plain"
  client_pod_name: "benchmark-client"
  security_condition: "plain"
  service_name_template: "{condition}-svc-{index}"
  grpc_port: 50051
  max_message_bytes: 16777216
  readiness_timeout: 120.0
  image: "thesisrq21acr26.azurecr.io/thesis-inference@sha256:9d65f25d9a6ee98e29fe4126271d54a39a7816669fa2edaab1367901886f8f25"
  image_pull_policy: "Always"
  resources:
    cpu_request: "1"
    cpu_limit: "1"
    memory_request: "1Gi"
    memory_limit: "1Gi"
  client_resources:
    # Keep the request aligned with the optional chain5 stress configs so
    # RQ2.1 topologies share the same benchmark-client scheduling contract.
    cpu_request: "100m"
    cpu_limit: "1"
    memory_request: "1Gi"
    memory_limit: "1Gi"
  placement:
    strategy: "strict_same_node"
    require_same_node: true
    fail_if_not_colocated: true
    node_selector:
      workload: "benchmark"
    node_pool: "rq15pool"
    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "benchmark"
        effect: "NoSchedule"
    require_control_plane_isolation: true
  resource_sampling:
    enabled: true
    interval_seconds: 5
    source: "kubectl_top"
    require_metrics_server: false
  metadata:
    capture_mesh: false
    record_control_plane_placement: false
  mesh:
    enabled: false
    implementation: "none"
