# -----------------------------------------------------------------------------
# experimental / smoke benchmark mode
#
# Intended for: Sanity checks, debugging, pipeline validation.
#
# Properties: Minimal iterations/rounds, early exits.
# Does not guarantee CPU stability; useful only for functional tests.
# Not suitable for thesis-facing numbers.
# -----------------------------------------------------------------------------
experiment:
  name: "RQ1.1 experimental"
  description: "Smoke test with minimal iterations"

model:
  name: "resnet18"
  pretrained: true
  device: "cpu"
  input_shape: [1, 3, 224, 224]
  precision: "fp32"

conditions:
  - name: "monolithic"
    type: "monolithic"
  - name: "split_after_layer2"
    type: "split"
    split_after: "layer2"

benchmark:
  rounds: 1
  warmup_iterations: 3
  measured_iterations: 5
  cooldown_seconds: 1
  seed: 42

grpc:
  host: "127.0.0.1"
  port: 50055
  max_message_bytes: 16777216

carry_forward:
  near_best_window_pct: 10.0
  degeneracy_threshold_pct: 5.0

parity:
  atol: 1.0e-5
  num_inputs: 3

warmup_calibration:
  window: 3
  cv_threshold: 0.05

cpu_stabilisation:
  threading:
    pytorch_intra_op: 4
    pytorch_inter_op: 1
    omp_num_threads: 4
    mkl_num_threads: 4
    openblas_num_threads: 4
  affinity:
    enabled: true
    num_cores: 4
    avoid_smt: true
    explicit_cpus: null
  priority:
    enabled: false # skip for smoke tests
    nice_value: 0
  governor:
    set_governor: false
    requested_mode: "performance"
  turbo:
    disable_turbo: false
