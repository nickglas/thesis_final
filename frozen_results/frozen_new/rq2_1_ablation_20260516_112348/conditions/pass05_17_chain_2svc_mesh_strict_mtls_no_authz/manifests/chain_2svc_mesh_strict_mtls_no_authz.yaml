apiVersion: v1
kind: Service
metadata:
  name: chain-2svc-mesh-strict-mtls-no-authz-svc-1
  namespace: rq21-ab-c2-strict
  labels:
    app: thesis-inference
    experiment: rq21-ab-c2-strict
    workload-role: service
    security-condition: mesh_strict_mtls_no_authz
    mesh-enabled: 'true'
    condition: chain_2svc_mesh_strict_mtls_no_authz
    segment-index: '1'
spec:
  type: ClusterIP
  selector:
    app: thesis-inference
    condition: chain_2svc_mesh_strict_mtls_no_authz
    segment-index: '1'
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chain-2svc-mesh-strict-mtls-no-authz-svc-1
  namespace: rq21-ab-c2-strict
  labels:
    app: thesis-inference
    experiment: rq21-ab-c2-strict
    workload-role: service
    security-condition: mesh_strict_mtls_no_authz
    mesh-enabled: 'true'
    condition: chain_2svc_mesh_strict_mtls_no_authz
    segment-index: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thesis-inference
      condition: chain_2svc_mesh_strict_mtls_no_authz
      segment-index: '1'
  template:
    metadata:
      labels:
        app: thesis-inference
        experiment: rq21-ab-c2-strict
        workload-role: service
        security-condition: mesh_strict_mtls_no_authz
        mesh-enabled: 'true'
        condition: chain_2svc_mesh_strict_mtls_no_authz
        experiment-condition: chain_2svc_mesh_strict_mtls_no_authz
        segment-index: '1'
      annotations:
        sidecar.istio.io/proxyCPU: 100m
        sidecar.istio.io/proxyCPULimit: 500m
        sidecar.istio.io/proxyMemory: 128Mi
        sidecar.istio.io/proxyMemoryLimit: 512Mi
    spec:
      containers:
      - name: inference
        image: thesisrq15acr.azurecr.io/thesis-inference@sha256:d292aef407ee8a15da2bdaa680de1cc24b0975e7de81d27e1fc3a7d128b8736b
        imagePullPolicy: Always
        ports:
        - containerPort: 50051
          name: grpc
        args:
        - --segment_index
        - '0'
        - --host
        - 0.0.0.0
        - --port
        - '50051'
        - --max_message_bytes
        - '16777216'
        - --split_points
        - layer2
        - --next_address
        - chain-2svc-mesh-strict-mtls-no-authz-svc-2.rq21-ab-c2-strict.svc.cluster.local:50051
        env:
        - name: PYTORCH_INTRA_OP_THREADS
          value: '1'
        - name: PYTORCH_INTER_OP_THREADS
          value: '1'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: MKL_NUM_THREADS
          value: '1'
        - name: OPENBLAS_NUM_THREADS
          value: '1'
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
      serviceAccountName: rq21-ab-c2-svc1
      nodeSelector:
        agentpool: rq15pool
        workload: benchmark
      tolerations:
      - key: workload
        operator: Equal
        value: benchmark
        effect: NoSchedule
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                experiment-condition: chain_2svc_mesh_strict_mtls_no_authz
            topologyKey: kubernetes.io/hostname
---
