# Generated benchmark client pod.
# Regenerate from the experiment config before applying.
apiVersion: v1
kind: Pod
metadata:
  name: benchmark-client
  namespace: rq22-client-mtls
  labels:
    app: thesis-inference
    experiment: rq22-chain2-mtls
    workload-role: client
    security-condition: mtls
    mesh-enabled: 'false'
    role: client
  annotations:
    sidecar.istio.io/inject: 'false'
spec:
  restartPolicy: Never
  containers:
  - name: client
    image: rq22thesis2servicestee.azurecr.io/thesis-inference@sha256:c5f8e1fd41f9f016b77176bd02a0657833f74b86f5647e47a70eab4b648dd898
    imagePullPolicy: Always
    command:
    - sleep
    - infinity
    env:
    - name: PYTORCH_INTRA_OP_THREADS
      value: '1'
    - name: PYTORCH_INTER_OP_THREADS
      value: '1'
    - name: OMP_NUM_THREADS
      value: '1'
    - name: MKL_NUM_THREADS
      value: '1'
    - name: OPENBLAS_NUM_THREADS
      value: '1'
    - name: MY_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: MY_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: '1'
        memory: 1Gi
  nodeSelector:
    agentpool: r22s1std
    rq: '2.2'
    rq22-role: service1-standard
