apiVersion: v1
kind: Service
metadata:
  name: chain-2svc-mtls-confidential-service2-svc-1
  namespace: rq22-chain2-mtls
  labels:
    app: thesis-inference
    experiment: rq22-chain2-mtls
    workload-role: service
    security-condition: mtls
    mesh-enabled: 'true'
    condition: chain_2svc_mtls_confidential_service2
    segment-index: '1'
spec:
  type: ClusterIP
  selector:
    app: thesis-inference
    condition: chain_2svc_mtls_confidential_service2
    segment-index: '1'
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chain-2svc-mtls-confidential-service2-svc-1
  namespace: rq22-chain2-mtls
  labels:
    app: thesis-inference
    experiment: rq22-chain2-mtls
    workload-role: service
    security-condition: mtls
    mesh-enabled: 'true'
    condition: chain_2svc_mtls_confidential_service2
    segment-index: '1'
    rq: '2.2'
    rq22-placement-role: service1-standard
    confidential-compute: 'false'
    rq22-vm-size: Standard_D8as_v5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thesis-inference
      condition: chain_2svc_mtls_confidential_service2
      segment-index: '1'
  template:
    metadata:
      labels:
        app: thesis-inference
        experiment: rq22-chain2-mtls
        workload-role: service
        security-condition: mtls
        mesh-enabled: 'true'
        condition: chain_2svc_mtls_confidential_service2
        experiment-condition: chain_2svc_mtls_confidential_service2
        segment-index: '1'
        rq: '2.2'
        rq22-placement-role: service1-standard
        confidential-compute: 'false'
        rq22-vm-size: Standard_D8as_v5
      annotations:
        sidecar.istio.io/proxyCPU: 100m
        sidecar.istio.io/proxyCPULimit: 500m
        sidecar.istio.io/proxyMemory: 128Mi
        sidecar.istio.io/proxyMemoryLimit: 512Mi
    spec:
      containers:
      - name: inference
        image: somerandomnewacrname.azurecr.io/thesis-inference@sha256:a1c5b261c7a16ec0dbf67bcb894bf9b73d4ae7e1a5f9b2abdd5d9f5899255c79
        imagePullPolicy: Always
        ports:
        - containerPort: 50051
          name: grpc
        args:
        - --segment_index
        - '0'
        - --host
        - 0.0.0.0
        - --port
        - '50051'
        - --max_message_bytes
        - '16777216'
        - --split_points
        - layer2
        - --next_address
        - chain-2svc-mtls-confidential-service2-svc-2.rq22-chain2-mtls.svc.cluster.local:50051
        env:
        - name: PYTORCH_INTRA_OP_THREADS
          value: '1'
        - name: PYTORCH_INTER_OP_THREADS
          value: '1'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: MKL_NUM_THREADS
          value: '1'
        - name: OPENBLAS_NUM_THREADS
          value: '1'
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
      serviceAccountName: rq22-chain2-svc1
      nodeSelector:
        agentpool: r22s1std
        rq: '2.2'
        rq22-role: service1-standard
---
