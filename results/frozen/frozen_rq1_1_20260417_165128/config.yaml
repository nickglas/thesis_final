# -----------------------------------------------------------------------------
# fully controlled benchmark mode
#
# Intended for: Official thesis evaluation.
#
# Properties: Single-threaded PyTorch execution pinned strictly to
# a single physical core with SMT avoided. High process priority.
# Governor explicitly requested as CPU performance mode, and turbo
# disabling explicitly requested to minimize frequency variance.
# -----------------------------------------------------------------------------
experiment:
  name: "RQ1.1 fully controlled"
  description: "Strictly controlled single-core benchmark for thesis defensibility"

model:
  name: "resnet18"
  pretrained: true
  device: "cpu"
  input_shape: [1, 3, 224, 224]
  precision: "fp32"

conditions:
  - name: "monolithic"
    type: "monolithic"
  - name: "split_after_layer1"
    type: "split"
    split_after: "layer1"
  - name: "split_after_layer2"
    type: "split"
    split_after: "layer2"
  - name: "split_after_layer3"
    type: "split"
    split_after: "layer3"
  - name: "split_after_layer4"
    type: "split"
    split_after: "layer4"

benchmark:
  rounds: 5
  warmup_iterations: 50
  measured_iterations: 200
  cooldown_seconds: 5
  seed: 42

grpc:
  host: "127.0.0.1"
  port: 50051
  max_message_bytes: 16777216

carry_forward:
  near_best_window_pct: 5.0
  degeneracy_threshold_pct: 10.0

parity:
  atol: 1.0e-5
  num_inputs: 5

warmup_calibration:
  window: 10
  cv_threshold: 0.02

cpu_stabilisation:
  threading:
    pytorch_intra_op: 1
    pytorch_inter_op: 1
    omp_num_threads: 1
    mkl_num_threads: 1
    openblas_num_threads: 1
  affinity:
    enabled: true
    num_cores: 1
    avoid_smt: true
    explicit_cpus: null
  priority:
    enabled: true
    nice_value: -5
  governor:
    set_governor: true
    requested_mode: "performance"
  turbo:
    disable_turbo: true
