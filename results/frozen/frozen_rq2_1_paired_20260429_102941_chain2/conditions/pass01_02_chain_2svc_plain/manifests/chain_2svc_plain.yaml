apiVersion: v1
kind: Service
metadata:
  name: chain-2svc-plain-svc-1
  namespace: rq21-chain2-plain
  labels:
    app: thesis-inference
    experiment: rq21-chain2-plain
    workload-role: service
    security-condition: plain
    mesh-enabled: 'false'
    condition: chain_2svc_plain
    segment-index: '1'
spec:
  type: ClusterIP
  selector:
    app: thesis-inference
    condition: chain_2svc_plain
    segment-index: '1'
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chain-2svc-plain-svc-1
  namespace: rq21-chain2-plain
  labels:
    app: thesis-inference
    experiment: rq21-chain2-plain
    workload-role: service
    security-condition: plain
    mesh-enabled: 'false'
    condition: chain_2svc_plain
    segment-index: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thesis-inference
      condition: chain_2svc_plain
      segment-index: '1'
  template:
    metadata:
      labels:
        app: thesis-inference
        experiment: rq21-chain2-plain
        workload-role: service
        security-condition: plain
        mesh-enabled: 'false'
        condition: chain_2svc_plain
        experiment-condition: chain_2svc_plain
        segment-index: '1'
    spec:
      containers:
      - name: inference
        image: thesisrq21acr26.azurecr.io/thesis-inference@sha256:524e8618c61d97f466b647cdc408e836256a94807790ad66321ae724f975a221
        imagePullPolicy: Always
        ports:
        - containerPort: 50051
          name: grpc
        args:
        - --segment_index
        - '0'
        - --host
        - 0.0.0.0
        - --port
        - '50051'
        - --max_message_bytes
        - '16777216'
        - --split_points
        - layer2
        - --next_address
        - chain-2svc-plain-svc-2.rq21-chain2-plain.svc.cluster.local:50051
        env:
        - name: PYTORCH_INTRA_OP_THREADS
          value: '1'
        - name: PYTORCH_INTER_OP_THREADS
          value: '1'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: MKL_NUM_THREADS
          value: '1'
        - name: OPENBLAS_NUM_THREADS
          value: '1'
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
      nodeSelector:
        agentpool: rq15pool
        workload: benchmark
      tolerations:
      - key: workload
        operator: Equal
        value: benchmark
        effect: NoSchedule
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                experiment-condition: chain_2svc_plain
            topologyKey: kubernetes.io/hostname
---
