# -----------------------------------------------------------------------------
# RQ1.2 fully controlled benchmark mode
#
# Intended for: Fine-grained refinement within the coarse late-stage region
# carried forward from RQ1.1.
#
# Properties: Same strict single-threaded, single-core stabilisation as
# RQ1.1 fully controlled. Conditions include the monolithic baseline,
# the two RQ1.1 carry-forward anchors (layer2, layer3), and one new
# block-level split point (layer3.0) to probe within-stage granularity.
# -----------------------------------------------------------------------------
experiment:
  name: "RQ1.2 fine-grained refinement"
  description: >-
    Block-level refinement within the late-stage coarse region (layer2–layer3)
    carried forward from RQ1.1. Tests whether splitting within layer3 at a
    finer architectural boundary reveals latency differences not visible at
    coarse stage boundaries, while controlling for identical activation sizes.

model:
  name: "resnet18"
  pretrained: true
  device: "cpu"
  input_shape: [1, 3, 224, 224]
  precision: "fp32"

conditions:
  - name: "monolithic"
    type: "monolithic"
  - name: "split_after_layer2"
    type: "split"
    split_after: "layer2"
  - name: "split_after_layer3_block0"
    type: "split"
    split_after: "layer3.0"
  - name: "split_after_layer3"
    type: "split"
    split_after: "layer3"

benchmark:
  rounds: 5
  warmup_iterations: 50
  measured_iterations: 200
  cooldown_seconds: 5
  seed: 42

grpc:
  host: "127.0.0.1"
  port: 50051
  max_message_bytes: 16777216

carry_forward:
  near_best_window_pct: 5.0
  degeneracy_threshold_pct: 10.0

parity:
  atol: 1.0e-5
  num_inputs: 5

warmup_calibration:
  window: 10
  cv_threshold: 0.02
  # Fixed warmup per the thesis methodology: calibration is diagnostic only,
  # not adaptive. 0 = run exactly warmup_iterations and never extend.
  max_extra_iterations: 0

cpu_stabilisation:
  threading:
    pytorch_intra_op: 1
    pytorch_inter_op: 1
    omp_num_threads: 1
    mkl_num_threads: 1
    openblas_num_threads: 1
  affinity:
    enabled: true
    num_cores: 1
    avoid_smt: true
    explicit_cpus: null
  priority:
    enabled: true
    nice_value: -5
  governor:
    set_governor: true
    requested_mode: "performance"
  turbo:
    disable_turbo: true
