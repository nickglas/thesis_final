apiVersion: v1
kind: Service
metadata:
  name: chain-5svc-svc-1
  namespace: rq14
  labels:
    app: thesis-inference
    condition: chain_5svc
    segment-index: "1"
spec:
  type: ClusterIP
  selector:
    app: thesis-inference
    condition: chain_5svc
    segment-index: "1"
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chain-5svc-svc-1
  namespace: rq14
  labels:
    app: thesis-inference
    condition: chain_5svc
    segment-index: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thesis-inference
      condition: chain_5svc
      segment-index: "1"
  template:
    metadata:
      labels:
        app: thesis-inference
        condition: chain_5svc
        segment-index: "1"
    spec:
      containers:
        - name: inference
          image: thesis-inference:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
          args:
            - "--segment_index"
            - "0"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "50051"
            - "--max_message_bytes"
            - "16777216"
            - "--split_points"
            - "layer1"
            - "layer2"
            - "layer3"
            - "layer4"
            - "--next_address"
            - "chain-5svc-svc-2.rq14.svc.cluster.local:50051"
          env:
            - name: PYTORCH_INTRA_OP_THREADS
              value: "1"
            - name: PYTORCH_INTER_OP_THREADS
              value: "1"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
---
