# Generated benchmark client pod.
# Regenerate from the experiment config before applying.
apiVersion: v1
kind: Pod
metadata:
  name: benchmark-client
  namespace: rq15b
  labels:
    app: thesis-inference
    experiment: rq15b
    workload-role: client
    role: client
spec:
  restartPolicy: Never
  containers:
  - name: client
    image: thesisrq15acr.azurecr.io/thesis-inference@sha256:240631e29c8c1a66a1dfce8a430d0498c805a7a1b4dea1202746b094c289aa47
    imagePullPolicy: Always
    command:
    - sleep
    - infinity
    env:
    - name: PYTORCH_INTRA_OP_THREADS
      value: '1'
    - name: PYTORCH_INTER_OP_THREADS
      value: '1'
    - name: OMP_NUM_THREADS
      value: '1'
    - name: MKL_NUM_THREADS
      value: '1'
    - name: OPENBLAS_NUM_THREADS
      value: '1'
    - name: MY_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: MY_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        cpu: '1'
        memory: 1Gi
  nodeSelector:
    agentpool: rq15bpool
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            workload-role: service
        topologyKey: kubernetes.io/hostname
