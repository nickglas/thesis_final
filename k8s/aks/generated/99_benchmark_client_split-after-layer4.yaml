# Generated benchmark client pod.
# Regenerate from the experiment config before applying.
# Condition-specific placement manifest for split_after_layer4.
apiVersion: v1
kind: Pod
metadata:
  name: benchmark-client
  namespace: rq11-azure
  labels:
    app: thesis-inference
    role: client
    workload-role: client
    experiment: rq11-azure
    condition: split_after_layer4
    experiment-condition: split_after_layer4
spec:
  restartPolicy: Never
  containers:
  - name: client
    image: thesisrq11acr.azurecr.io/thesis-inference@sha256:6d3af14a988a138142d11b12c6a09d328b2d381eac3041bab171e2faf10c0279
    imagePullPolicy: Always
    command:
    - sleep
    - infinity
    env:
    - name: PYTORCH_INTRA_OP_THREADS
      value: '1'
    - name: PYTORCH_INTER_OP_THREADS
      value: '1'
    - name: OMP_NUM_THREADS
      value: '1'
    - name: MKL_NUM_THREADS
      value: '1'
    - name: OPENBLAS_NUM_THREADS
      value: '1'
    - name: MY_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: MY_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        cpu: '1'
        memory: 1Gi
  nodeSelector:
    agentpool: rq11pool
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            condition: split_after_layer4
            segment-index: '1'
            workload-role: service
        topologyKey: kubernetes.io/hostname
