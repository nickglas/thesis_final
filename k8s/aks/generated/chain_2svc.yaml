apiVersion: v1
kind: Service
metadata:
  name: chain-2svc-svc-1
  namespace: rq15b
  labels:
    app: thesis-inference
    experiment: rq15b
    workload-role: service
    condition: chain_2svc
    segment-index: '1'
spec:
  type: ClusterIP
  selector:
    app: thesis-inference
    condition: chain_2svc
    segment-index: '1'
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chain-2svc-svc-1
  namespace: rq15b
  labels:
    app: thesis-inference
    experiment: rq15b
    workload-role: service
    condition: chain_2svc
    segment-index: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thesis-inference
      condition: chain_2svc
      segment-index: '1'
  template:
    metadata:
      labels:
        app: thesis-inference
        experiment: rq15b
        workload-role: service
        condition: chain_2svc
        experiment-condition: chain_2svc
        segment-index: '1'
    spec:
      containers:
      - name: inference
        image: thesisrq15bacr.azurecr.io/thesis-inference@sha256:c5d44bd08783fc78177c2fc4b5d9209d08258309f9d907fcb02cd1315e0fe1de
        imagePullPolicy: Always
        ports:
        - containerPort: 50051
          name: grpc
        args:
        - --segment_index
        - '0'
        - --host
        - 0.0.0.0
        - --port
        - '50051'
        - --max_message_bytes
        - '16777216'
        - --split_points
        - layer2
        - --next_address
        - chain-2svc-svc-2.rq15b.svc.cluster.local:50051
        env:
        - name: PYTORCH_INTRA_OP_THREADS
          value: '1'
        - name: PYTORCH_INTER_OP_THREADS
          value: '1'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: MKL_NUM_THREADS
          value: '1'
        - name: OPENBLAS_NUM_THREADS
          value: '1'
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
      nodeSelector:
        agentpool: rq15bpool
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                experiment-condition: chain_2svc
                workload-role: service
            topologyKey: kubernetes.io/hostname
          - labelSelector:
              matchLabels:
                workload-role: client
            topologyKey: kubernetes.io/hostname
---
