apiVersion: v1
kind: Service
metadata:
  name: split-after-layer4-svc-1
  namespace: rq11-azure
  labels:
    app: thesis-inference
    condition: split_after_layer4
    segment-index: '1'
    experiment: rq11-azure
    workload-role: service
spec:
  type: ClusterIP
  selector:
    app: thesis-inference
    condition: split_after_layer4
    segment-index: '1'
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: split-after-layer4-svc-1
  namespace: rq11-azure
  labels:
    app: thesis-inference
    condition: split_after_layer4
    segment-index: '1'
    experiment: rq11-azure
    workload-role: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thesis-inference
      condition: split_after_layer4
      segment-index: '1'
  template:
    metadata:
      labels:
        app: thesis-inference
        condition: split_after_layer4
        segment-index: '1'
        experiment: rq11-azure
        experiment-condition: split_after_layer4
        workload-role: service
    spec:
      containers:
      - name: inference
        image: thesisrq11acr.azurecr.io/thesis-inference@sha256:6d3af14a988a138142d11b12c6a09d328b2d381eac3041bab171e2faf10c0279
        imagePullPolicy: Always
        ports:
        - containerPort: 50051
          name: grpc
        args:
        - --split_after
        - layer4
        - --host
        - 0.0.0.0
        - --port
        - '50051'
        - --max_message_bytes
        - '16777216'
        env:
        - name: PYTORCH_INTRA_OP_THREADS
          value: '1'
        - name: PYTORCH_INTER_OP_THREADS
          value: '1'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: MKL_NUM_THREADS
          value: '1'
        - name: OPENBLAS_NUM_THREADS
          value: '1'
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
        command:
        - python
        - -m
        - src.services.service_b_runner
      nodeSelector:
        agentpool: rq11pool
